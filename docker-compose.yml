services:
  backend:
    build: ./backend
    container_name: wind_backend
    restart: always
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=wind_suitability_db

  frontend:
    build: ./frontendnpx
    container_name: wind_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://windturbine.ink/api
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
