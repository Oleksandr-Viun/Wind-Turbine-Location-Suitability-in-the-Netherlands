services:
  backend:
    build: ./backend
    container_name: wind_backend
    restart: always
    environment:
      - MONGO_URI=${MONGO_URI}

  frontend:
    build: ./frontendnpx
    container_name: wind_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://18.159.211.115
    volumes:
      - ./frontendnpx:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend