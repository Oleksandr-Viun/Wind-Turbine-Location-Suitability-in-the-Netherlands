# Перенаправление с 80 (HTTP) на 443 (HTTPS)
server {
    listen 80;
    server_name windturbine.ink www.windturbine.ink;
    return 301 https://$host$request_uri;
}

# Главный сервер (HTTPS)
server {
    listen 443 ssl;
    server_name windturbine.ink www.windturbine.ink;

    ssl_certificate /etc/letsencrypt/live/windturbine.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/windturbine.ink/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Бэкенд
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Фронтенд
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
