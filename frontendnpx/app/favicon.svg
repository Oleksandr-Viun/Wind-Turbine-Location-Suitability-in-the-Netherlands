<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Градиент для лопастей -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  
  <!-- Синий фон с закругленными углами -->
  <rect width="64" height="64" rx="14" fill="#1e3a8a" />
  
  <!-- Сияющее солнце на заднем плане -->
  <g transform="translate(44, 22)">
    <!-- Мягкое свечение (эффект гало) -->
    <circle cx="0" cy="0" r="16" fill="#fef08a" opacity="0.15" />
    <circle cx="0" cy="0" r="11" fill="#fde047" opacity="0.3" />
    <!-- Плотный центр солнца -->
    <circle cx="0" cy="0" r="6.5" fill="#fbbf24" />
    
    <!-- Лучи солнца -->
    <g stroke="#fde047" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="-9" x2="0" y2="-13" />
      <line x1="0" y1="9" x2="0" y2="13" />
      <line x1="-9" y1="0" x2="-13" y2="0" />
      <line x1="9" y1="0" x2="13" y2="0" />
      <line x1="-6.5" y1="-6.5" x2="-9" y2="-9" />
      <line x1="6.5" y1="6.5" x2="9" y2="9" />
      <line x1="-6.5" y1="6.5" x2="-9" y2="9" />
      <line x1="6.5" y1="-6.5" x2="9" y2="-9" />
    </g>
  </g>
  
  <!-- Башня ветряка -->
  <path d="M29 32 L35 32 L38 62 L26 62 Z" fill="#e2e8f0" />
  
  <!-- Лопасти (Градиентные) -->
  <g transform="translate(32, 32)">
    <path d="M-3 -4 C-5 -15 0 -30 0 -30 C0 -30 5 -15 3 -4 Z" fill="url(#bladeGrad)" />
    <path d="M-3 -4 C-5 -15 0 -30 0 -30 C0 -30 5 -15 3 -4 Z" fill="url(#bladeGrad)" transform="rotate(120)" />
    <path d="M-3 -4 C-5 -15 0 -30 0 -30 C0 -30 5 -15 3 -4 Z" fill="url(#bladeGrad)" transform="rotate(240)" />
  </g>
  
  <!-- Центр ветряка (Ступица) -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  <circle cx="32" cy="32" r="1.5" fill="#1e3a8a" />
</svg>
